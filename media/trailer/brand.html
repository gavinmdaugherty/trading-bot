<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"JBM";src:url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2");font-weight:700}
*{margin:0;box-sizing:border-box}
body{background:#000;font-family:"Inter Display","Inter",sans-serif}
.pfp{position:relative;width:1000px;height:1000px;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,#14142a 0%,#07070e 62%,#040408 100%)}
.pfp .halo{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(61,255,181,.20),transparent 46%),
  radial-gradient(circle at 30% 25%,rgba(124,58,237,.35),transparent 45%),radial-gradient(circle at 75% 80%,rgba(255,94,168,.18),transparent 45%)}
.pfp svg{position:absolute;inset:0}
.ban{position:relative;width:1500px;height:500px;overflow:hidden;background:#05050a}
.ban .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:50px 50px;-webkit-mask-image:radial-gradient(ellipse at 62% 50%,#000 20%,transparent 70%)}
.blob{position:absolute;border-radius:50%;filter:blur(110px)}
.ban .w{position:absolute;left:560px;top:118px;font-weight:800;font-size:168px;letter-spacing:-.06em;line-height:1;
  background:linear-gradient(90deg,#fff 10%,#bff9e4 45%,#a78bfa 90%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(61,255,181,.3))}
.ban .t{position:absolute;left:566px;top:318px;font-size:38px;font-weight:700;color:#eef0ff;letter-spacing:-.02em}
.ban .t span{background:linear-gradient(90deg,#3dffb5,#6ea8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.ban .caps{position:absolute;left:566px;top:390px;display:flex;gap:12px}
.ban .cap{font:700 15px "JBM";letter-spacing:.12em;color:#8d91b3;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 14px;background:rgba(255,255,255,.03)}
.ban svg{position:absolute;left:1095px;top:-30px;opacity:.9}
</style></head><body>
<div class="pfp" id="pfp"><div class="halo"></div>
<svg viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="g" x1="0.15" y1="0.1" x2="0.85" y2="0.95"><stop offset="0" stop-color="#3dffb5"/><stop offset=".5" stop-color="#6ea8ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3dffb5" stop-opacity=".9"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".5"/><stop offset="1" stop-color="#ff5ea8" stop-opacity=".8"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <circle cx="500" cy="500" r="352" fill="none" stroke="url(#ring)" stroke-width="6" opacity=".55"/>
  <!-- four-point spark: concave star -->
  <path id="star" d="M500 168 C 528 400, 600 472, 832 500 C 600 528, 528 600, 500 832 C 472 600, 400 528, 168 500 C 400 472, 472 400, 500 168 Z" fill="url(#g)" filter="url(#glow)"/>
  <path d="M500 330 C 512 450, 550 488, 670 500 C 550 512, 512 550, 500 670 C 488 550, 450 512, 330 500 C 450 488, 488 450, 500 330 Z" fill="#ffffff" opacity=".9" filter="url(#soft)"/>
  <circle cx="500" cy="500" r="26" fill="#fff"/>
  <!-- small accent sparks -->
  <path d="M742 262 C 746 290, 754 298, 782 302 C 754 306, 746 314, 742 342 C 738 314, 730 306, 702 302 C 730 298, 738 290, 742 262 Z" fill="#ff5ea8" filter="url(#glow)" opacity=".95"/>
  <path d="M268 716 C 271 736, 277 742, 297 745 C 277 748, 271 754, 268 774 C 265 754, 259 748, 239 745 C 259 742, 265 736, 268 716 Z" fill="#3dffb5" filter="url(#glow)" opacity=".9"/>
</svg></div>
<div class="ban" id="ban"><div class="grid"></div>
  <div class="blob" style="width:700px;height:700px;background:#3dffb5;left:-260px;top:-320px;opacity:.14"></div>
  <div class="blob" style="width:700px;height:700px;background:#7c3aed;right:-200px;top:-300px;opacity:.30"></div>
  <div class="blob" style="width:600px;height:600px;background:#ff5ea8;left:500px;top:260px;opacity:.12"></div>
  <svg viewBox="0 0 1000 1000" width="560" height="560"><defs>
    <linearGradient id="g2" x1="0.15" y1="0.1" x2="0.85" y2="0.95"><stop offset="0" stop-color="#3dffb5"/><stop offset=".5" stop-color="#6ea8ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <path d="M500 168 C 528 400, 600 472, 832 500 C 600 528, 528 600, 500 832 C 472 600, 400 528, 168 500 C 400 472, 472 400, 500 168 Z" fill="url(#g2)" filter="url(#glow2)" opacity=".8"/></svg>
  <div class="w">Spark</div>
  <div class="t">The pump.fun bot that <span>learns</span>.</div>
  <div class="caps"><span class="cap">ON-CHAIN</span><span class="cap">RUG FILTERS</span><span class="cap">SELF-LEARNING</span><span class="cap">WALLET MEMORY</span></div>
</div>
</body></html>
